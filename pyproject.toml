[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tapcolor"
version = "1.0.0"
description = "Official Python client for the TapColor Developer API — browse coloring categories and collections."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "TapColor" }]
keywords = ["tapcolor", "coloring", "coloring-pages", "api", "sdk", "rest"]
dependencies = ["requests>=2.25"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://developer.tapcolor.app"
Documentation = "https://developer.tapcolor.app"
Source = "https://github.com/tapcolorapp/tapcolor-python"
"Request a key" = "https://tapcolor.app/contact/"

[tool.hatch.build.targets.wheel]
packages = ["src/tapcolor"]
